# Apply last, after compose.yaml and any static/PostgreSQL/Gluetun overrides.
# Example for a future published release; see docs/releases.md for availability:
# RSS_IMAGE=ghcr.io/ldogg123/rss-workshop:v0.4.0-browser docker compose -f compose.yaml -f compose.image.yaml up -d
services:
  rss-workshop:
    build: !reset null
    image: ${RSS_IMAGE:?Set RSS_IMAGE to a tagged image or digest}
