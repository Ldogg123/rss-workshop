name: Publish container images

# Publishing is an explicit release action. Pushes, pull requests, and creating
# a Git tag run no registry writes through this workflow.
# Dispatch from a reviewed workflow revision. CI and image builds use the
# immutable release tag commit; source verification uses maintained tooling.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.1.0 or v0.1.0-rc.1'
        type: string
        required: true
      sources_reviewed:
        description: 'Both architecture source archives are on this GitHub release and match the images being released'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: publish-container-images
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      created: ${{ steps.release.outputs.created }}
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - name: Validate version and derive registry coordinates
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCES_REVIEWED: ${{ inputs.sources_reviewed }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]] || (( ${#RELEASE_VERSION} > 100 )); then
            printf '%s\n' 'Version must be vMAJOR.MINOR.PATCH, optionally followed by -rc.N.' >&2
            exit 1
          fi
          if [[ "$SOURCES_REVIEWED" != true ]]; then
            printf '%s\n' 'Review and attach matching Debian source archives before publishing; see docs/releases.md.' >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_VERSION}" > "$RUNNER_TEMP/release.json"
          object=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" --jq '[.object.type, .object.sha] | @tsv')
          for depth in 1 2 3 4 5 6 7 8; do
            read -r kind release_sha <<< "$object"
            [[ "$release_sha" =~ ^[a-f0-9]{40}$ ]] || { printf '%s\n' 'Invalid release tag object.' >&2; exit 1; }
            if [[ "$kind" == commit ]]; then break; fi
            [[ "$kind" == tag ]] || { printf '%s\n' 'The release tag does not resolve to a commit.' >&2; exit 1; }
            object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${release_sha}" --jq '[.object.type, .object.sha] | @tsv')
          done
          [[ "$kind" == commit ]] || { printf '%s\n' 'Release tag nesting exceeds the supported limit.' >&2; exit 1; }
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1]) as file:
              release = json.load(file)
          assets = {asset['name'] for asset in release.get('assets', []) if asset.get('size', 0) > 0}
          if release.get('draft') is not False or release.get('tag_name') != os.environ['RELEASE_VERSION']:
              sys.exit('Corresponding sources must be on the published GitHub release for this exact version.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              stable = release.get('prerelease') is False and '-' not in os.environ['RELEASE_VERSION']
              output.write(f'stable={str(stable).lower()}\n')
          for arch in ('amd64', 'arm64'):
              prefix = f"debian-sources-{os.environ['RELEASE_VERSION']}-linux-{arch}.tar.gz"
              parts = sorted(name for name in assets if name.startswith(prefix + '.part-'))
              expected = [f'{prefix}.part-{number:02d}' for number in range(len(parts))]
              if prefix in assets and not parts:
                  continue
              if prefix not in assets and parts and parts == expected:
                  continue
              sys.exit(f'Missing, mixed, or noncontiguous source archive assets for {arch}; see docs/releases.md.')
          PY
          printf 'image=ghcr.io/%s\nversion=%s\ncommit=%s\ncreated=%s\n' \
            "${GITHUB_REPOSITORY,,}" "$RELEASE_VERSION" "$release_sha" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  validate:
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
    permissions:
      contents: read

  platforms:
    name: Build, verify sources, and upload ${{ matrix.arch }}
    needs: [metadata, validate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      TOOLING_COMMIT: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build final static image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: rss-workshop:release-static
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT=${{ needs.metadata.outputs.commit }}
            BUILD_DATE=${{ needs.metadata.outputs.created }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          labels: |
            org.opencontainers.image.created=${{ needs.metadata.outputs.created }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=static-${{ matrix.arch }}
      - name: Build final browser image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.browser
          target: app
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: rss-workshop:release-browser
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT=${{ needs.metadata.outputs.commit }}
            BUILD_DATE=${{ needs.metadata.outputs.created }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          labels: |
            org.opencontainers.image.created=${{ needs.metadata.outputs.created }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=browser-${{ matrix.arch }}
      - name: Freeze the image identities to verify and publish
        id: built
        run: |
          printf 'static=%s\nbrowser=%s\n' \
            "$(docker image inspect --format '{{.Id}}' rss-workshop:release-static)" \
            "$(docker image inspect --format '{{.Id}}' rss-workshop:release-browser)" >> "$GITHUB_OUTPUT"
      - name: Smoke test the final static image with its Compose opt-out
        env:
          RSS_SMOKE_COMPOSE: '1'
          RSS_SMOKE_IMAGE: ${{ steps.built.outputs.static }}
        run: python3 scripts/smoke.py
      - name: Smoke test the final browser image with default Compose
        env:
          RSS_SMOKE_COMPOSE: '1'
          RSS_SMOKE_BROWSER: '1'
          RSS_SMOKE_IMAGE: ${{ steps.built.outputs.browser }}
        run: python3 scripts/smoke.py
      - name: Check out maintained verification tools after image builds
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: Verify durable corresponding source against these exact images
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          ARCH: ${{ matrix.arch }}
          STATIC_ID: ${{ steps.built.outputs.static }}
          BROWSER_ID: ${{ steps.built.outputs.browser }}
        shell: bash
        run: |
          directory="$RUNNER_TEMP/corresponding-sources"
          prefix="debian-sources-${VERSION}-linux-${ARCH}.tar.gz"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "${prefix}*" --dir "$directory"
          shopt -s nullglob
          parts=("$directory/$prefix".part-??)
          if [[ -f "$directory/$prefix" ]] && (( ${#parts[@]} == 0 )); then
            archives=("$directory/$prefix")
          elif [[ ! -f "$directory/$prefix" ]] && (( ${#parts[@]} > 0 )); then
            for index in "${!parts[@]}"; do
              printf -v expected '%s.part-%02d' "$directory/$prefix" "$index"
              [[ "${parts[$index]}" == "$expected" ]] || { printf '%s\n' 'Source archive parts are not contiguous.' >&2; exit 1; }
            done
            archives=("${parts[@]}")
          else
            printf '%s\n' 'Expected one source archive or a contiguous set of archive parts.' >&2
            exit 1
          fi
          arguments=()
          for archive in "${archives[@]}"; do arguments+=(--archive "$archive"); done
          python3 "$GITHUB_WORKSPACE/.release-tools/scripts/check-release-sources.py" "${arguments[@]}" --architecture "$ARCH" \
            --static-image "$STATIC_ID" --browser-image "$BROWSER_ID"
          mkdir -p "$RUNNER_TEMP/release-digests"
          printf 'version=%s\ncommit=%s\ntooling_commit=%s\narchitecture=%s\nstatic=%s\nbrowser=%s\n' \
            "$VERSION" "$RELEASE_COMMIT" "$TOOLING_COMMIT" "$ARCH" "$STATIC_ID" "$BROWSER_ID" \
            > "$RUNNER_TEMP/release-digests/build-${ARCH}.txt"
          docker image inspect "$STATIC_ID" "$BROWSER_ID" > "$RUNNER_TEMP/release-digests/images-${ARCH}.json"
          sha256sum "${archives[@]}" > "$RUNNER_TEMP/release-digests/sources-${ARCH}.sha256"
          printf 'Application commit: `%s`; verification tooling: `%s`.\n' "$RELEASE_COMMIT" "$TOOLING_COMMIT" >> "$GITHUB_STEP_SUMMARY"
      - name: Recheck the release tag before registry uploads
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          object=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq '[.object.type, .object.sha] | @tsv')
          for depth in 1 2 3 4 5 6 7 8; do
            read -r kind release_sha <<< "$object"
            [[ "$release_sha" =~ ^[a-f0-9]{40}$ ]] || { printf '%s\n' 'Invalid release tag object.' >&2; exit 1; }
            if [[ "$kind" == commit ]]; then break; fi
            [[ "$kind" == tag ]] || { printf '%s\n' 'The release tag does not resolve to a commit.' >&2; exit 1; }
            object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${release_sha}" --jq '[.object.type, .object.sha] | @tsv')
          done
          [[ "$kind" == commit && "$release_sha" == "$RELEASE_COMMIT" ]] || { printf '%s\n' 'The release tag changed during publication.' >&2; exit 1; }
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the verified image IDs without rebuilding
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          ARCH: ${{ matrix.arch }}
          STATIC_ID: ${{ steps.built.outputs.static }}
          BROWSER_ID: ${{ steps.built.outputs.browser }}
        shell: bash
        run: |
          for variant in static browser; do
            if [[ "$variant" == static ]]; then image_id="$STATIC_ID"; else image_id="$BROWSER_ID"; fi
            staging="${IMAGE}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}-${variant}"
            docker tag "$image_id" "$staging"
            docker push "$staging"
            docker image inspect "$image_id" | python3 -c \
              'import json,sys; image=json.load(sys.stdin)[0]; refs=[r for r in image["RepoDigests"] if r.startswith(sys.argv[1]+"@sha256:")]; assert len(refs)==1, "expected one pushed image digest"; print(refs[0])' \
              "$IMAGE" > "$RUNNER_TEMP/release-digests/${variant}-${ARCH}.txt"
          done
      - name: Record immutable platform digests and verification inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-digests/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  manifests:
    name: Publish ${{ matrix.variant }} manifest
    needs: [metadata, platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [static, browser]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge only verified platform digests into the version tag
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          object=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq '[.object.type, .object.sha] | @tsv')
          for depth in 1 2 3 4 5 6 7 8; do
            read -r kind release_sha <<< "$object"
            [[ "$release_sha" =~ ^[a-f0-9]{40}$ ]] || { printf '%s\n' 'Invalid release tag object.' >&2; exit 1; }
            if [[ "$kind" == commit ]]; then break; fi
            [[ "$kind" == tag ]] || { printf '%s\n' 'The release tag does not resolve to a commit.' >&2; exit 1; }
            object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${release_sha}" --jq '[.object.type, .object.sha] | @tsv')
          done
          [[ "$kind" == commit && "$release_sha" == "$RELEASE_COMMIT" ]] || { printf '%s\n' 'The release tag changed during publication.' >&2; exit 1; }
          tag="${IMAGE}:${VERSION}-${VARIANT}"
          if docker buildx imagetools inspect "$tag" > /dev/null 2> "$RUNNER_TEMP/manifest-error"; then
            printf '%s\n' 'This version tag already exists and will not be overwritten.' >&2
            exit 1
          fi
          case "$(cat "$RUNNER_TEMP/manifest-error")" in
            *': not found'*|*'manifest unknown'*|*'MANIFEST_UNKNOWN'*) ;;
            *) cat "$RUNNER_TEMP/manifest-error" >&2; exit 1 ;;
          esac
          amd64=$(cat "digests/${VARIANT}-amd64.txt")
          arm64=$(cat "digests/${VARIANT}-arm64.txt")
          [[ "$amd64" =~ ^"${IMAGE}"@sha256:[a-f0-9]{64}$ && "$arm64" =~ ^"${IMAGE}"@sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools create --tag "$tag" --metadata-file "$RUNNER_TEMP/manifest.json" "$amd64" "$arm64"
          digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.descriptor"]["digest"])' "$RUNNER_TEMP/manifest.json")
          printf '%s\n' "$tag" "${IMAGE}@${digest}" >> "$GITHUB_STEP_SUMMARY"

  stable:
    name: Update stable image tags
    needs: [metadata, manifests]
    if: needs.metadata.outputs.stable == 'true'
    uses: ./.github/workflows/promote-images.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
    permissions:
      contents: read
      packages: write
