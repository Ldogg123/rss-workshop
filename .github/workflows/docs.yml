name: Documentation

# Builds the documentation site from the guides and publishes it to GitHub
# Pages. CI skips Markdown guides, so this workflow is what checks their links.
# A pull request builds and checks the site without deploying; a push to main
# or a manual run on main also deploys it, in the repository whose Pages
# address is the site_url in website/zensical.toml. A fork or a copy builds and
# checks only, until its owner changes that address.
on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/**'
      - 'website/**'
      - 'scripts/docs-site.py'
      - 'scripts/docs_site_test.py'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '*.md'
      - 'docs/**'
      - 'website/**'
      - 'scripts/docs-site.py'
      - 'scripts/docs_site_test.py'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede builds of the same pull request. Deployments queue instead, so a
  # running one is never cancelled halfway. Only runs that can deploy share
  # the pages group: GitHub keeps one pending run per group, so a manual build
  # of another branch must not take the place of a waiting deployment.
  group: rss-workshop-docs-${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'pages' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publishes: ${{ steps.home.outputs.publishes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check the staging script and every link in the guides
        run: make docs-test
      - name: Build the site in strict mode and check the built pages
        run: make docs
      - name: Check whether the site is configured for this repository
        id: home
        run: |
          publishes="$(python3 scripts/docs-site.py publishes --repository "$GITHUB_REPOSITORY")"
          echo "publishes=$publishes" >> "$GITHUB_OUTPUT"
      - name: Upload the site for deployment
        if: steps.home.outputs.publishes == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build/site

  deploy:
    name: Publish to GitHub Pages
    # Only this job can publish, and only from main of the repository the
    # site is configured for.
    if: needs.build.outputs.publishes == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails with a clear message while Pages is not enabled for the
      # repository with GitHub Actions as its source.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
