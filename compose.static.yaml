# Optional lightweight runtime without local Chromium.
# docker compose -f compose.yaml -f compose.static.yaml up -d --pull always --wait
# Leave RSS_IMAGE blank for this default, or select a matching -static tag/digest.
services:
  rss-workshop:
    image: ${RSS_IMAGE:-ghcr.io/ldogg123/rss-workshop:latest-static}
    pull_policy: always
    environment:
      # Also overrides CHROMIUM_PATH if a browser image is selected explicitly.
      CHROMIUM_PATH: ""
      BROWSER_SLOTS: ""
    tmpfs: !override
      - /tmp:size=32m,mode=1777
    security_opt: !override
      - no-new-privileges:true
    shm_size: !reset null
    pids_limit: !reset null
    mem_limit: !reset null
